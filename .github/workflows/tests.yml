name: tests

on:
  workflow_dispatch:
  push:
    branches: [main, windows-port]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
            experimental: false
          - os: ubuntu-latest
            node: "22"
            experimental: false
          - os: macos-latest
            node: "20"
            experimental: false
          - os: macos-latest
            node: "22"
            experimental: false
          - os: windows-latest
            node: "20"
            experimental: false
          # node-pty 1.1.0 currently has an upstream ConPTY AttachConsole race
          # on newer Windows/Node combinations. Keep it visible without making
          # the known-good Windows Node 20 port look broken.
          - os: windows-latest
            node: "22"
            experimental: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Check the detector against real limit messages
        run: node dist/src/cli.js doctor
