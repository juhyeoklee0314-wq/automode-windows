name: tests

on:
  workflow_dispatch:
  push:
    branches: [main, windows-port]
  pull_request:

jobs:
  test:
    # node-pty is a native module and PTY behavior is platform-sensitive; prove
    # the unchanged upstream baseline on Linux, macOS, and Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Check the detector against real limit messages
        run: node dist/src/cli.js doctor
