name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # node-pty is a native module and the PTY code is POSIX; both deserve
    # proving on more than one machine.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Check the detector against real limit messages
        run: node dist/src/cli.js doctor
