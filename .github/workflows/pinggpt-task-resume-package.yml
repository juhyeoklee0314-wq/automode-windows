name: PingGPT Task Resume Packaging

on:
  workflow_dispatch:
  push:
    branches:
      - pinggpt-task-discovery-001

concurrency:
  group: pinggpt-task-resume-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout task-resume branch
        uses: actions/checkout@v4

      - name: Set up Node 20.20.2
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install exact dependencies
        shell: pwsh
        run: npm ci

      - name: Test task-resume branch
        shell: pwsh
        run: npm test

      - name: Package NSIS candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win nsis --x64 --publish never --config.directories.output=release-task-resume-nsis

      - name: Verify NSIS candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem -LiteralPath 'release-task-resume-nsis' -File -Filter 'PingGPT-Windows-Setup-*.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one PingGPT Setup EXE, found $($setup.Count)." }
          $hash = Get-FileHash -LiteralPath $setup[0].FullName -Algorithm SHA256
          "BRANCH=pinggpt-task-discovery-001" | Set-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8
          "COMMIT=$env:GITHUB_SHA" | Add-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8
          "PATH=$($setup[0].Name)" | Add-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8
          "SIZE=$($setup[0].Length)" | Add-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8
          "SHA256=$($hash.Hash)" | Add-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8
          "AUTHENTICODE_STATUS=$((Get-AuthenticodeSignature -LiteralPath $setup[0].FullName).Status)" | Add-Content -LiteralPath 'PingGPT_TaskResume_Manifest.txt' -Encoding UTF8

      - name: Build code-only runtime patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'runtime-patch'
          $payload = Join-Path $root 'payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          Copy-Item -LiteralPath 'dist' -Destination $payload -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $payload 'src\gui') -Force | Out-Null
          Copy-Item -LiteralPath 'src\gui\renderer' -Destination (Join-Path $payload 'src\gui') -Recurse -Force
          Copy-Item -LiteralPath 'src\gui\assets' -Destination (Join-Path $payload 'src\gui') -Recurse -Force
          Copy-Item -LiteralPath 'package.json' -Destination $payload -Force

          $manifest = Join-Path $root 'FILE_SHA256_MANIFEST.txt'
          "SCHEMA=pinggpt.runtime-patch.v1" | Set-Content -LiteralPath $manifest -Encoding UTF8
          "BRANCH=pinggpt-task-discovery-001" | Add-Content -LiteralPath $manifest -Encoding UTF8
          "COMMIT=$env:GITHUB_SHA" | Add-Content -LiteralPath $manifest -Encoding UTF8
          "MODE=CODE_ONLY_NO_EXECUTABLE" | Add-Content -LiteralPath $manifest -Encoding UTF8
          "PAYLOAD_ROOT=payload" | Add-Content -LiteralPath $manifest -Encoding UTF8

          Get-ChildItem -LiteralPath $payload -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($payload, $_.FullName).Replace('\','/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              "FILE=$relative|SIZE=$($_.Length)|SHA256=$hash" |
                Add-Content -LiteralPath $manifest -Encoding UTF8
            }

          $zip = Join-Path $PWD 'Working_ZIP_PingGPT_261002_ProfileOwnership_R1.05_RuntimePatch.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -LiteralPath (Join-Path $root 'payload'), $manifest -DestinationPath $zip -CompressionLevel Optimal

          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          "ZIP_SHA256=$zipHash" | Set-Content -LiteralPath 'PingGPT_RuntimePatch_OuterHash.txt' -Encoding UTF8
          "ZIP_SIZE=$((Get-Item -LiteralPath $zip).Length)" | Add-Content -LiteralPath 'PingGPT_RuntimePatch_OuterHash.txt' -Encoding UTF8
          "COMMIT=$env:GITHUB_SHA" | Add-Content -LiteralPath 'PingGPT_RuntimePatch_OuterHash.txt' -Encoding UTF8

      - name: Upload code-only runtime patch
        uses: actions/upload-artifact@v4
        with:
          name: pinggpt-task-discovery-runtime-patch
          path: |
            Working_ZIP_PingGPT_261002_ProfileOwnership_R1.05_RuntimePatch.zip
            PingGPT_RuntimePatch_OuterHash.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload NSIS candidate
        uses: actions/upload-artifact@v4
        with:
          name: pinggpt-task-resume-nsis-candidate
          path: |
            release-task-resume-nsis/PingGPT-Windows-Setup-*.exe
            release-task-resume-nsis/*.blockmap
            PingGPT_TaskResume_Manifest.txt
          if-no-files-found: error
          retention-days: 7
